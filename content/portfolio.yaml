        why: "Isolates external system integrations (Azure Resource Graph, SQL, REST APIs) in strictly typed harnesses."
        scaling: "Asynchronous task queue with rate-limited connection pools."
        failure_modes: "Exponential backoff with jitter on 429/503 errors."
        cost: "Negligible compute overhead."
        security: "Role-Based Access Control (RBAC) via Azure Managed Identity."
