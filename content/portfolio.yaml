architectures:
  - slug: "enterprise-multi-agent"
    title: "TXTSense & VoC Enterprise Ingestion & Orchestration Mesh"
    summary: "Production multi-agent mesh running deterministic state-machine graphs, sandboxed tool execution, and zero-trust security perimeters."
