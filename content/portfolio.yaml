        scaling: "Provisioned Throughput Units (PTU) with regional spillover endpoints."
        failure_modes: "Automatic fallback to local quantized model or cached completions."
        cost: "$5.00 / 1M input tokens, $15.00 / 1M output tokens."
      - id: "search-vector"
        label: "Azure AI Search (Hybrid + Reranker)"
        layer: "Data & Vector Store"
        why: "Sub-50ms hybrid retrieval combining BM25 keyword search with dense vectors and cross-encoder semantic reranking."
        scaling: "Automatic replica scaling on query load spikes."
        failure_modes: "Degrades to sparse BM25 indexing if vector embedding endpoint times out."
        cost: "Standard S1 instance tier."
        security: "Private link endpoint, encrypted keys via Managed Identity."
