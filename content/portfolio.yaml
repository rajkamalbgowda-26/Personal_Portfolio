      - id: "client-ui"
        label: "Next.js Web Atelier"
        layer: "Client Experience"
        why: "Provides 120 FPS spatial rendering and instantaneous SSE token streaming to end users."
        scaling: "Edge cached via Azure Front Door Anycast CDN."
        failure_modes: "Falls back to static SSR rendering and Calm mode if WebGL context is lost."
        cost: "Minimal static edge compute."
        security: "Content Security Policy, strict cookie encryption, TLS 1.3."
      - id: "apim"
        label: "Azure Front Door & Ingress Gateway"
        layer: "Ingress & Gateway"
        why: "Protects backend containers with global Anycast DDoS mitigation, WAF rules, and token bucket rate-limiting."
        scaling: "Autoscales across global edge POPs."
        failure_modes: "Failover route group to backup container replica."
        cost: "$35/month base + $0.01 per GB bandwidth."
        security: "Enforces TLS 1.3, managed certificates, OWASP top 10 WAF rules."
      - id: "fastapi-core"
        label: "FastAPI Async Controller"
        layer: "Agent Orchestration"
        why: "High-throughput non-blocking event loop in Python 3.12 managing multi-agent dispatch and streaming SSE protocols."
        scaling: "Azure Container Apps KEDA rules scale from 1 to 10 replicas on HTTP queue pressure."
        failure_modes: "Graceful task timeout with circuit breaker response."
        cost: "Pay-per-second vCPU/GiB memory allocation."
        security: "Non-root Alpine container, internal VNet private endpoints."
      - id: "langgraph-agent"
        label: "LangGraph State Machine Engine"
        layer: "Agent Orchestration"
        why: "Enforces deterministic DAG state transitions, cyclic reflection checks, and verifiable execution checkpoints."
        scaling: "Stateless runner nodes persist checkpoints into Redis/PostgreSQL."
        failure_modes: "Bounded recursion limit (max 10 iterations) triggers human escalation."
        cost: "Compute included in FastAPI worker pod."
        security: "Zero code execution privileges; strictly structured Pydantic tool schemas."
      - id: "tool-executor"
